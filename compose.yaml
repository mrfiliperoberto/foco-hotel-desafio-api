services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foco-hotel-api:local
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: foco_hotel
      DB_USERNAME: foco
      DB_PASSWORD: foco_local
      APP_URL: http://127.0.0.1:8001
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: foco_hotel
      MYSQL_USER: foco
      MYSQL_PASSWORD: foco_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data: